name: site

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'images/**'
      - '**/images/**'
      - 'the-broken-apps/**'
      - 'the-observer/**'
      - 'k8s-terraform/**'
      - 'site/**'
      - '.github/workflows/site.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - '**/*.md'
      - 'images/**'
      - '**/images/**'
      - 'the-broken-apps/**'
      - 'the-observer/**'
      - 'k8s-terraform/**'
      - 'site/**'
      - '.github/workflows/site.yml'

permissions:
  contents: read

concurrency:
  # A merged PR's "closed" event reports github.ref as the base branch, so keying on github.ref alone
  # put it in the same group as the push to main and cancelled the production deploy.
  group: site-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-dist
          path: site/dist
          if-no-files-found: error

  deploy:
    needs: build-test
    # Fork PRs have no access to secrets, so they build and test but don't deploy.
    if: >-
      github.event_name == 'push' ||
      (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-dist
          path: site/dist
      - uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: site/dist
          skip_app_build: true
          skip_api_build: true

  close-preview:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
