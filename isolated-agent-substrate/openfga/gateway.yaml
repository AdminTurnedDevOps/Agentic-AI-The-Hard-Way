apiVersion: v1
kind: ServiceAccount
metadata:
  name: openfga-actors-gateway
  namespace: openfga-actors
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openfga-actors-gateway
  namespace: openfga-actors
data:
  config.yaml: |
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    gateways:
      http:
        port: 8080
        protocol: HTTP
    routes:
    - name: protected-actors
      gateways: [http]
      matches:
      - path:
          pathPrefix: /
      policies:
        extAuthz:
          host: openfga-actors-auth.openfga-actors.svc:8080
          failureMode: deny
          policies:
            http:
              requestTimeout: 10s
          includeRequestHeaders: [authorization, ate-target-actor]
          protocol:
            http:
              path: '"/authorize"'
      backends:
      # The router only accepts mTLS from SPIFFE IDs on its allowlist.
      - host: atenet-router.ate-system.svc:443
        policies:
          backendTLS:
            cert: /run/router-client/credential-bundle.pem
            key: /run/router-client/credential-bundle.pem
            root: /run/router-client/router-ca.pem
            hostname: atenet-router.ate-system.svc
          requestHeaderModifier:
            remove: [authorization]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfga-actors-gateway
  namespace: openfga-actors
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openfga-actors-gateway
  template:
    metadata:
      labels:
        app: openfga-actors-gateway
    spec:
      serviceAccountName: openfga-actors-gateway
      containers:
      - name: agentgateway
        image: cr.agentgateway.dev/agentgateway:v1.5.0
        args: [-f, /etc/agentgateway/config.yaml]
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 15021
          name: readiness
        readinessProbe:
          httpGet:
            path: /healthz/ready
            port: 15021
          periodSeconds: 5
        volumeMounts:
        - name: config
          mountPath: /etc/agentgateway
        - name: router-client
          mountPath: /run/router-client
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: openfga-actors-gateway
      # Client certificate for spiffe://cluster.local/ns/openfga-actors/sa/openfga-actors-gateway,
      # plus the CA that signs the router's serving certificate.
      - name: router-client
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: router-ca.pem
---
apiVersion: v1
kind: Service
metadata:
  name: openfga-actors-gateway
  namespace: openfga-actors
spec:
  selector:
    app: openfga-actors-gateway
  ports:
  - name: http
    port: 8080
    targetPort: http
