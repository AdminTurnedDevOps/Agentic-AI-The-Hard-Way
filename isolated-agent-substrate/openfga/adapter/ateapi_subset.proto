// Wire-compatible subset of substrate api/ateapi/v1/ateapi.proto (v1.0.0).
// gRPC routes by package, so the package must match too. Check the field
// numbers against the Substrate checkout used by the lab.
syntax = "proto3";
package substrate.ateapi.v1;

service Control {
  rpc GetActor(GetActorRequest) returns (Actor);
}

message ObjectRef {
  string atespace = 1;
  string name = 2;
}
message ResourceMetadata {
  string atespace = 1;
  string name = 2;
  string uid = 3;
}
message GetActorRequest { ObjectRef actor = 1; }
message Actor { ResourceMetadata metadata = 1; }
